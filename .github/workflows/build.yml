name: build

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: .cache
          key: items-${{ github.run_id }}
          restore-keys: items-
      - run: pip install --require-hashes -r requirements.txt
      - run: python build.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: site
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: site
          path: _site
      # IndexNow only accepts URLs at or below the key file's folder, so the key file sits at the site root.
      - if: vars.INDEXNOW_KEY != ''
        run: echo "$KEY" > "_site/$KEY.txt"
        env:
          KEY: ${{ vars.INDEXNOW_KEY }}
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 #v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
      # Tells Bing and Yandex the sitemap pages changed. A failed ping must not fail the deploy.
      - if: vars.INDEXNOW_KEY != ''
        continue-on-error: true
        run: |
          urls=$(grep -oP '(?<=<loc>)[^<]+' _site/sitemap.xml | jq -R . | jq -sc .)
          host=$(echo "$urls" | jq -r '.[0]' | cut -d/ -f3)
          jq -n --arg host "$host" --arg key "$KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}' \
            | curl -sS --fail-with-body -H 'Content-Type: application/json' -d @- https://api.indexnow.org/indexnow
        env:
          KEY: ${{ vars.INDEXNOW_KEY }}

  keepalive:
    # GitHub disables schedules in public repos after 60 days without activity; re-enabling resets that clock.
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/build.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
